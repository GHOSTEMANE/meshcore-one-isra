name: isra - testar e compilar

# A cada envio para o ramo isra: testes do MeshCore (todos), testes isra do MC1Services,
# compilação da app para o simulador e testes isra da app (MC1Tests/Isra).
# Os mesmos passos que isra/ci-test.sh no Mac. Nada é assinado, enviado nem instalado.

on:
  push:
    branches: [isra]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Escolher o Xcode mais recente
        run: |
          ls -d /Applications/Xcode_*.app
          # the upstream builds with Xcode 27 on its own runner; GitHub's runner may only
          # have 26.x (Swift 6.2 is enough for the packages and the app)
          X=$(ls -d /Applications/Xcode_*.app | sed -E 's|.*/Xcode_([0-9.]+)\.app|\1 &|' | sort -V | tail -1 | cut -d' ' -f2)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          case "$X" in *Xcode_27*) ;; *) echo "::warning::sem Xcode 27 neste runner; a usar $X" ;; esac

      - name: XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Testes dos pacotes (MeshCore, MC1Services isra)
        run: isra/ci-test.sh packages

      - name: App no simulador e testes isra da app
        run: isra/ci-test.sh app
